services:
  - type: web
    name: blindreader-api
    runtime: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "uvicorn server:app --host 0.0.0.0 --port 8000"
    envVars:
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: credentials.json
    autoDeploy: true
    plan: free